name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APK
        # Chạy riêng từng biến thể: KSP của Room ghi cùng một file schema, chạy song song dễ hỏng file
        run: ./gradlew assembleRelease --stacktrace && ./gradlew assembleDebug --stacktrace
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ClipperCast.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/ClipperCast-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clippercast-apk
          path: out/*.apk
      # Bản cài thử mới nhất: tải thẳng trên điện thoại ở trang Releases
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ClipperCast (bản cài thử mới nhất)
          prerelease: true
          make_latest: false
          body: |
            Bản build tự động từ commit ${{ github.sha }}.
            Tải **ClipperCast.apk** và cài trên Android 8.0 trở lên (cần cho phép "Cài ứng dụng không rõ nguồn gốc").
          files: out/*.apk
